<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Kitchen — Lunch Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241812; }
  #game { position: fixed; inset: 0; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Kitchen: run a one-chef kitchen — take orders, chop, grill, build dishes and serve them before the tickets run out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
